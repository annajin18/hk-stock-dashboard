name: 每日自动更新

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests openpyxl beautifulsoup4 pdfplumber pymupdf

      - name: 生成绿鞋跟踪页面
        run: python generate_greenshoe_html.py

      - name: 生成解禁概览页面
        run: python generate_unlock_html.py --no-ccass

      - name: 提交更新后的页面
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html greenshoe_data.json unlock_data.json vendor/
          if git diff --cached --quiet; then
            echo "页面没有变化,无需提交"
            exit 0
          fi
          git commit -m "每日自动更新 $(date +%F)"
          git push
