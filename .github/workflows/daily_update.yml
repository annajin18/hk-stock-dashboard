name: 每日自动更新

on:
  push:
    branches: [main]
  schedule:
    # 每天北京时间 08:00 自动更新(UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    # 防止自动更新机器人提交的代码再次触发本工作流(死循环)
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests openpyxl beautifulsoup4 pdfplumber pymupdf

      - name: 生成绿鞋跟踪页面
        run: python generate_greenshoe_html.py

      - name: 生成解禁概览页面
        run: python generate_unlock_html.py --no-ccass

      - name: 同步部署目录
        run: |
          mkdir -p publish
          cp index.html hk_greenshoe.html greenshoe_detail.html hk_unlock_overview.html hk_ggt_ru_tong.html hk_ipo_reminder.html crs_calculator.html publish/
          cp -r vendor publish/

      - name: 部署到 Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          npx wrangler deploy --config wrangler.jsonc

      - name: 提交更新后的页面
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git add *.html greenshoe_data.json unlock_data.json vendor/ publish/
          if git diff --cached --quiet; then
            echo "页面没有变化,无需提交"
          else
            git commit -m "每日自动更新 $(date +%F)"
            git push
          fi
