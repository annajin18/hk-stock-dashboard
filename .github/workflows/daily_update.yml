name: 每日自动更新

on:
  push:
    branches: [main]
  schedule:
    # 每天北京时间 08:00 自动更新(UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    # 由自动更新机器人提交的代码不再重复触发构建,避免死循环
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests openpyxl beautifulsoup4 pdfplumber pymupdf

      - name: 生成绿鞋跟踪页面
        run: python generate_greenshoe_html.py

      - name: 生成解禁概览页面
        run: python generate_unlock_html.py --no-ccass

      - name: 提交更新后的页面
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html greenshoe_data.json unlock_data.json
          if git diff --cached --quiet; then
            echo "页面没有变化,无需提交"
            exit 0
          fi
          git commit -m "每日自动更新 $(date +%F)"
          git push

      - name: 上传到腾讯云 COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          pip install coscmd
          mkdir -p publish
          cp index.html hk_greenshoe.html greenshoe_detail.html hk_unlock_overview.html hk_ggt_ru_tong.html hk_ipo_reminder.html crs_calculator.html publish/
          coscmd config -a "$TENCENT_SECRET_ID" -s "$TENCENT_SECRET_KEY" -b hk-dashboard-1462592466 -r ap-guangzhou
          coscmd upload -r ./publish/ /
